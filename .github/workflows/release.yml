name: appimage

# Every push to main that passes the tests builds the AppImage and publishes
# it as a GitHub release, so installed AppImages pick it up on their next
# `self-update` / daily background check. Version: <major>.<minor> from
# nimshell.nimble + the workflow run number as patch (e.g. v0.2.14).
#
# Pushing a `v*` tag publishes that exact version instead (manual override).
# Pull requests build the AppImage as a workflow artifact without publishing.
# After publishing, only the newest KEEP_RELEASES releases (and their tags)
# are kept.
on:
  push:
    branches: [main, master]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - ".gitignore"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  KEEP_RELEASES: 5

# One release build at a time, in push order.
concurrency:
  group: appimage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  appimage:
    # Oldest supported runner → oldest glibc → runs on the most distros.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y patchelf zsync libpcre3 libssl3
      - name: Test
        run: nim c -r --hints:off tests/test_nimshell.nim
      - name: Version
        id: version
        run: |
          base=$(sed -n 's/^version *= *"\(.*\)"/\1/p' nimshell.nimble)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            publish=true
          elif [[ "$GITHUB_EVENT_NAME" == "push" || "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]] &&
               [[ "$GITHUB_REF" == refs/heads/main || "$GITHUB_REF" == refs/heads/master ]]; then
            version="${base%.*}.${GITHUB_RUN_NUMBER}"
            publish=true
          else
            version="${base}-dev+${GITHUB_SHA::7}"
            publish=false
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Building nimshell $version (publish: $publish)"
      - name: Build AppImage
        run: packaging/build-appimage.sh "${{ steps.version.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: nimshell-${{ steps.version.outputs.version }}-x86_64.AppImage
          path: dist/*
      - name: Publish release
        if: steps.version.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: nimshell v${{ steps.version.outputs.version }}
          files: dist/*
          generate_release_notes: true
          make_latest: true
      - name: Prune old releases
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Newest first by creation time; everything past KEEP_RELEASES goes,
          # together with its git tag. The release just published is newest.
          gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 \
              --json tagName,createdAt \
              --jq "sort_by(.createdAt) | reverse | .[${KEEP_RELEASES}:] | .[].tagName" |
          while read -r tag; do
            [ -n "$tag" ] || continue
            echo "Deleting release $tag"
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          done
