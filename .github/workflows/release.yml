name: appimage

# Every push to main that passes the tests builds the AppImage and publishes
# it to the single rolling GitHub release under the `release` tag (the tag is
# moved to the built commit and the assets are replaced), so installed
# AppImages pick it up on their next `self-update` / daily background check.
# Version: <major>.<minor> from nimshell.nimble + the workflow run number as
# patch (e.g. 0.2.14); it is published as the `VERSION` asset.
#
# Pull requests build the AppImage as a workflow artifact without publishing.
# Any other (versioned) releases and their tags are deleted after publishing.
on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - ".gitignore"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_TAG: release

# One release build at a time, in push order.
concurrency:
  group: appimage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  appimage:
    # Oldest supported runner → oldest glibc → runs on the most distros.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y patchelf zsync libpcre3 libssl3
      - name: Test
        run: nim c -r --hints:off tests/test_nimshell.nim
      - name: Version
        id: version
        run: |
          base=$(sed -n 's/^version *= *"\(.*\)"/\1/p' nimshell.nimble)
          if [[ "$GITHUB_EVENT_NAME" == "push" || "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]] &&
               [[ "$GITHUB_REF" == refs/heads/main || "$GITHUB_REF" == refs/heads/master ]]; then
            version="${base%.*}.${GITHUB_RUN_NUMBER}"
            publish=true
          else
            version="${base}-dev+${GITHUB_SHA::7}"
            publish=false
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Building nimshell $version (publish: $publish)"
      - name: Build AppImage
        run: packaging/build-appimage.sh "${{ steps.version.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: nimshell-${{ steps.version.outputs.version }}-x86_64.AppImage
          path: dist/*
      - name: Publish release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # VERSION goes up last: clients only see the new version once the
          # new AppImage is in place.
          echo "$VERSION" > "$RUNNER_TEMP/VERSION"
          # Move the rolling tag to this commit.
          git tag -f "$RELEASE_TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$RELEASE_TAG"
          notes="nimshell $VERSION, built from $GITHUB_SHA."
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/VERSION" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "nimshell v$VERSION" --notes "$notes" --latest
          else
            gh release create "$RELEASE_TAG" dist/* "$RUNNER_TEMP/VERSION" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --title "nimshell v$VERSION" --notes "$notes" --latest
          fi
      - name: Remove versioned releases
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Everything except the rolling release goes, together with its tag.
          gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 \
              --json tagName --jq ".[].tagName | select(. != \"$RELEASE_TAG\")" |
          while read -r tag; do
            [ -n "$tag" ] || continue
            echo "Deleting release $tag"
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          done
