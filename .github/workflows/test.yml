name: test

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        nim: ["1.6.x", "2.2.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ matrix.nim }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # std/re loads PCRE at runtime; the http builtin loads OpenSSL.
      - run: sudo apt-get update && sudo apt-get install -y libpcre3 libssl-dev
      - run: nim c -r tests/test_nimshell.nim
      - run: nimble build -y
      - run: ./nimshell -c 'range 10 | reverse | first 3'
